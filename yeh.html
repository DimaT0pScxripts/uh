<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini Navegador</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    width:100vw;
    height:100vh;
    overflow:hidden;
    font-family:Arial,sans-serif;
    background:#111;
}

#topbar{
    width:100%;
    height:60px;
    background:#1b1b1b;
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px;
    border-bottom:1px solid #333;
}

#url{
    flex:1;
    height:40px;
    border:none;
    outline:none;
    border-radius:8px;
    padding:0 12px;
    background:#2b2b2b;
    color:white;
    font-size:15px;
}

#go{
    height:40px;
    padding:0 20px;
    border:none;
    border-radius:8px;
    background:#00bfff;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

#go:hover{
    opacity:0.9;
}

#browser{
    width:100%;
    height:calc(100vh - 60px);
    border:none;
    background:white;
}

#status{
    position:absolute;
    top:70px;
    left:10px;
    background:#222;
    color:white;
    padding:8px;
    border-radius:5px;
    display:none;
}
</style>
</head>
<body>

<div id="topbar">
    <input
        id="url"
        type="text"
        placeholder="Digite um site (ex: example.com)"
    >
    <button id="go" onclick="openSite()">
        Abrir
    </button>
</div>

<div id="status"></div>

<iframe
    id="browser"
    src="https://example.com">
</iframe>

<script>

function openSite(){

    let url = document.getElementById("url").value.trim();

    if(url === "") return;

    if(
        !url.startsWith("http://") &&
        !url.startsWith("https://")
    ){
        url = "https://" + url;
    }

    document.getElementById("browser").src = url;
}

document.getElementById("url").addEventListener("keydown",function(e){
    if(e.key === "Enter"){
        openSite();
    }
});

</script>

</body>
</html>
